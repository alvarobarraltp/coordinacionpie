.sched-row{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--surface);border-bottom:1px solid var(--border);transition:.12s;cursor:pointer}

.pill.red{background:var(--red-bg);color:var(--red)}

.pill.purple{background:var(--purple-bg);color:var(--purple)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:var(--radius);font-size:16px;font-weight:600;transition:.15s;cursor:pointer;width:100%}

.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,0);pointer-events:none;z-index:500;transition:.3s;border-radius:inherit}
.sheet-bg.open{background:rgba(0,0,0,.45);pointer-events:all}
.sheet{position:absolute;bottom:0;left:0;right:0;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:var(--shadow-lg);transform:translateY(100%);transition:.35s cubic-bezier(.32,.72,0,1);max-height:93%;display:flex;flex-direction:column;overflow:hidden}
.sheet-bg.open .sheet{transform:translateY(0)}
.sheet-handle{width:36px;height:5px;background:var(--surface3);border-radius:3px;margin:10px auto 0;flex-shrink:0}
.sheet-nav{display:flex;align-items:center;padding:12px 16px 10px;border-bottom:1px solid var(--border);flex-shrink:0}
.sheet-title-text{flex:1;text-align:center;font-size:17px;font-weight:600}
.sheet-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:32px}
.sheet-scroll::-webkit-scrollbar{display:none}
.tab-strip{display:flex;gap:0;margin:0 16px 14px;background:var(--surface3);border-radius:10px;padding:2px;flex-shrink:0}
.tab-strip-btn{flex:1;padding:8px 4px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink2);text-align:center;transition:.15s;display:flex;align-items:center;justify-content:center;gap:4px}

.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 16px 16px}

.alert-wrap{padding:8px 16px 0;display:flex;flex-direction:column;gap:6px}
.alert-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:500}

.tl{display:flex;flex-direction:column}

.ios-toggle.on{background:var(--green)}
.ios-toggle::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.ios-toggle.on::after{left:22px}
.fab{position:absolute;bottom:calc(var(--tab-h) + 16px);right:20px;width:50px;height:50px;border-radius:50%;background:var(--blue);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,122,255,.5);z-index:100;transition:.2s}

.fade-up{animation:fadeUp .22s ease both}
.week-grid{display:flex;gap:6px;padding:0 16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.week-grid::-webkit-scrollbar{display:none}
.week-col{flex-shrink:0;width:78px;display:flex;flex-direction:column;gap:4px}
.week-col-head{font-size:11px;font-weight:700;color:var(--ink2);text-align:center;text-transform:uppercase;padding:4px 0 6px}
.week-slot{min-height:46px;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10.5px;font-weight:600;padding:4px;cursor:pointer}
.week-slot.empty{background:var(--surface);color:var(--ink3);border:1px dashed var(--border2)}
.week-slot.filled{color:#fff}
/* Checklist */
.chk-row{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--border)}
.chk-row:first-child{border-radius:var(--radius) var(--radius) 0 0}
.chk-row:last-child{border-bottom:none;border-radius:0 0 var(--radius) var(--radius)}
.chk-row:only-child{border-radius:var(--radius)}
.chk-box{width:24px;height:24px;border-radius:50%;border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:.15s}
.chk-box.checked{background:var(--green);border-color:var(--green)}
.chk-box.checked i{color:#fff;font-size:13px}
.chk-box.na{background:var(--surface3);border-color:var(--surface3)}
.chk-label{flex:1;font-size:14px;color:var(--ink)}
.chk-label.done{color:var(--ink3);text-decoration:line-through}
/* Rev history */
.rev-item{display:flex;gap:10px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--border)}
.rev-item:first-child{border-radius:var(--radius) var(--radius) 0 0}
.rev-item:last-child{border-bottom:none;border-radius:0 0 var(--radius) var(--radius)}
.rev-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:5px}
/* Login */
.login-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;gap:24px;background:var(--bg)}
.login-logo{font-family:var(--fnt-head);font-size:40px;color:var(--ink);letter-spacing:-.03em}
.login-card{background:var(--surface);border-radius:var(--radius-lg);padding:24px;width:100%;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
/* bday */
.bday-date-box{width:44px;height:44px;border-radius:10px;background:var(--red-bg);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.bday-day{font-size:17px;font-weight:800;color:var(--red);line-height:1}
.bday-month{font-size:9px;font-weight:700;color:var(--red);text-transform:uppercase}
.doc-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:700}
.doc-ok{background:var(--green-bg);color:var(--green-dark)}
.doc-miss{background:var(--red-bg);color:var(--red)}
.doc-partial{background:var(--orange-bg);color:var(--orange)}

const initials=n=>{if(!n)return'??';const p=n.trim().split(/\s+/);return(p.length>=2?p[0][0]+p[1][0]:p[0].slice(0,2)).toUpperCase()};
const avatarBg=name=>{const cs=['#007AFF','#34C759','#AF52DE','#FF9500','#FF3B30','#5AC8FA','#FF2D55','#30B0C7'];let h=0;for(let i=0;i<(name||'').length;i++)h=(h*31+name.charCodeAt(i))&0xFFFFFF;return cs[Math.abs(h)%cs.length]};
const todayStr=()=>{const d=new Date();return`${String(d.getDate()).padStart(2,'0')}-${String(d.getMonth()+1).padStart(2,'0')}-${d.getFullYear()}`};
const todayISO=()=>new Date().toISOString().split('T')[0];
const newId=()=>'i'+Date.now()+Math.random().toString(36).slice(2,5);

const timeNow=()=>{const n=new Date();return`${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`};
const getAge=fnac=>{if(!fnac)return null;const[d,m,y]=fnac.split('-').map(Number);const t=new Date();let age=t.getFullYear()-y;if(t.getMonth()+1<m||(t.getMonth()+1===m&&t.getDate()<d))age--;return age};
const getBdayDaysLeft=fnac=>{if(!fnac)return null;const[,m,]=fnac.split('-').map(Number);const[d,]=fnac.split('-').map(Number);const[,,y]=fnac.split('-').map(Number);const today=new Date();let next=new Date(today.getFullYear(),m-1,d);if(next<today)next=new Date(today.getFullYear()+1,m-1,d);return Math.ceil((next-today)/86400000)};
const lsGet=(k,def)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch{return def}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};

function useToast(){
  const[t,setT]=useState({msg:'',show:false,kind:'ok'});
  const timer=useRef();
  const show=useCallback((msg,kind='ok')=>{clearTimeout(timer.current);setT({msg,show:true,kind});timer.current=setTimeout(()=>setT(p=>({...p,show:false})),2500);},[]);
  return[t,show];
}
function useAlertWatcher(agenda,settings){
  const[alerts,setAlerts]=useState([]);
  const fired=useRef(new Set());
  useEffect(()=>{
    if(!settings.enabled)return;
    const tick=()=>{const now=new Date();agenda.forEach(ev=>{if(!ev.fecha||!ev.hora)return;const at=new Date(`${ev.fecha}T${ev.hora}`);const diff=(at-now)/60000;if(diff>0&&diff<=settings.minutes&&!fired.current.has(ev.id)){fired.current.add(ev.id);setAlerts(p=>[...p,{...ev,minsLeft:Math.round(diff)}]);}});};
    tick();const id=setInterval(tick,30000);return()=>clearInterval(id);
  },[agenda,settings]);
  const dismiss=id=>setAlerts(p=>p.filter(x=>x.id!==id));
  return[alerts,dismiss];
}

        <div className="stat-box"><div className="stat-num"style={{color:'var(--blue)'}}>{students.filter(s=>s.nee==='NEEP').length}</div><div className="stat-lbl">NEEP</div></div>
      </div>

function StudentSheet({student,isNew,cursos,observations,setObservations,aulaLogs,setAulaLogs,onClose,onSave,onDelete}){

  const history=useMemo(()=>{if(isNew||!student)return[];return[...observations.filter(o=>o.studentId===student.id).map(o=>({...o,_k:'obs'})),...aulaLogs.filter(a=>a.studentIds.includes(student.id)).map(a=>({...a,_k:'aula'}))].sort((a,b)=>b.date.localeCompare(a.date));},[student,observations,aulaLogs,isNew]);
  const saveObs=()=>{if(!of.type||!of.detail)return;setObservations(p=>[{...of,id:newId(),studentId:student.id},...p]);setOf({date:todayStr(),context:'Sala de clases',type:'',detail:''});setShowObs(false);};
  const saveAula=()=>{if(!af.activity||!af.detail)return;setAulaLogs(p=>[{...af,id:newId()},...p]);setAf({date:todayStr(),activity:'',detail:'',studentIds:[student.id]});setShowAula(false);};
  const tabs=[{id:'datos',label:'Datos',icon:'ph-user'},{id:'diag',label:'Diagnóstico',icon:'ph-brain'},{id:'hist',label:'Bitácora',icon:'ph-clock-counter-clockwise'}];

          <div style={{height:1,background:'var(--border)'}}/>

        </div>}

/* ══ AGENDA ══════════════════════════════════════════════════════════════ */
function AgendaScreen({agenda,setAgenda,students,alertSettings}){
  const[showAdd,setShowAdd]=useState(false);const[editEv,setEditEv]=useState(null);const[fd,setFd]=useState('');const[expandId,setExpandId]=useState(null);
  const sorted=useMemo(()=>[...agenda].sort((a,b)=>a.fecha.localeCompare(b.fecha)||a.hora.localeCompare(b.hora)),[agenda]);
  const filtered=fd?sorted.filter(e=>e.fecha===fd):sorted;
  const grouped=useMemo(()=>{const g={};filtered.forEach(e=>{if(!g[e.fecha])g[e.fecha]=[];g[e.fecha].push(e);});return g;},[filtered]);
  const del=id=>{setAgenda(p=>p.filter(x=>x.id!==id));setExpandId(null);};
  return(<>
    <NavBar title="Agenda"/>
    <div style={{padding:'10px 16px 0',display:'flex',gap:8,alignItems:'center'}}>
      <input type="date"value={fd}onChange={e=>setFd(e.target.value)}style={{flex:1,background:'var(--surface)',border:'1px solid var(--border)',borderRadius:9,padding:'8px 12px',fontSize:14,outline:'none',color:'var(--ink)'}}/>
      {fd&&<button onClick={()=>setFd('')}style={{fontSize:13,color:'var(--blue)',fontWeight:600,padding:'8px 4px'}}>Todo</button>}
    </div>
    <div className="screen-scroll"style={{flex:1}}>
      {Object.keys(grouped).length===0?<div style={{textAlign:'center',padding:'60px 24px',color:'var(--ink3)'}}><i className="ph ph-calendar-x"style={{fontSize:48,display:'block',opacity:.4,marginBottom:10}}/><div style={{fontWeight:700,fontSize:16,color:'var(--ink2)'}}>Sin eventos</div></div>:
        Object.entries(grouped).map(([date,evs])=>(
          <div key={date}>
            <div className="sec-title-sm"style={{paddingTop:20}}>{new Date(date+'T12:00').toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'})}</div>
            <div style={{margin:'0 16px'}}>
              {evs.map((e,i,arr)=>{const m=TIPO_META[e.tipo]||TIPO_META.otro;const exp=expandId===e.id;return(
                <div key={e.id}style={{background:'var(--surface)',borderRadius:i===0&&arr.length>1?'var(--radius) var(--radius) 0 0':i===arr.length-1&&arr.length>1?'0 0 var(--radius) var(--radius)':arr.length===1?'var(--radius)':'',borderBottom:i<arr.length-1?'1px solid var(--border)':'none',overflow:'hidden'}}>
                  <div className="sched-row"style={{borderRadius:0,border:'none',background:'transparent'}}onClick={()=>setExpandId(exp?null:e.id)}>
                    <div className="sched-strip"style={{background:m.color,minHeight:44}}/>
                    <div style={{flexShrink:0}}><div className="sched-time">{e.hora}</div><div style={{fontSize:11,color:'var(--ink3)'}}>{e.duracion}m</div></div>
                    <div className="sched-info"><div className="sched-title">{e.titulo}</div><div className="sched-meta">{e.lugar}</div></div>
                    <span className="pill"style={{background:m.color+'22',color:m.color,fontSize:11}}>{m.label}</span>
                    <i className={`ph ph-caret-${exp?'up':'down'}`}style={{color:'var(--ink3)',fontSize:17,marginLeft:4}}/>
                  </div>
                  {exp&&<div style={{padding:'0 14px 12px',background:'var(--surface2)'}}>
                    {e.obs&&<div style={{fontSize:13,color:'var(--ink2)',marginBottom:8,lineHeight:1.5}}>{e.obs}</div>}
                    {e.alerta&&<div style={{fontSize:12,color:'var(--orange)',marginBottom:8,display:'flex',alignItems:'center',gap:4}}><i className="ph ph-bell"style={{fontSize:14}}/>Alerta {e.alerta} min antes</div>}
                    <div style={{display:'flex',gap:8}}><button className="btn btn-gray btn-sm"onClick={ev=>{ev.stopPropagation();setEditEv(e);setShowAdd(true);}}><i className="ph ph-pencil"/>Editar</button><button className="btn btn-red btn-sm"onClick={ev=>{ev.stopPropagation();del(e.id);}}><i className="ph ph-trash"/>Eliminar</button></div>
                  </div>}
                </div>
              );})}
            </div>
          </div>
        ))
      }
      <div style={{height:90}}/>
    </div>
    <button className="fab"onClick={()=>{setEditEv(null);setShowAdd(true);}}><i className="ph ph-plus"/></button>
    {showAdd&&<AgendaForm initial={editEv}students={students}defaultAlert={alertSettings.minutes}onSave={ev=>{if(editEv)setAgenda(p=>p.map(x=>x.id===ev.id?ev:x));else setAgenda(p=>[...p,{...ev,id:newId()}]);setShowAdd(false);setEditEv(null);}}onClose={()=>{setShowAdd(false);setEditEv(null);}}/>}
  </>);
}
function AgendaForm({initial,students,defaultAlert,onSave,onClose}){
  const blank={titulo:'',tipo:'atencion',fecha:todayISO(),hora:'09:00',duracion:45,studentId:'',profId:'',alerta:defaultAlert||15,lugar:'Aula de Recursos',obs:''};

    <label className="field-label">Detalles</label>

    <label className="field-label">Fecha y hora</label>

    <label className="field-label">Estudiante (opcional)</label>

    <label className="field-label">Notas</label>

    <div style={{height:20}}/>
  </Sheet>);
}

/* ══ EVALUACIONES ════════════════════════════════════════════════════════ */

    <NavBar title="Evaluaciones"right={<button onClick={()=>{setEditEv(null);setF(blank);setShowAdd(true);}}style={{color:'var(--blue)',display:'flex',alignItems:'center',gap:4,fontSize:15,fontWeight:600}}><i className="ph ph-plus"style={{fontSize:22}}/>Nueva</button>}/>

        <div className="field-row"><label>Estudiante</label><select value={f.studentId}onChange={e=>sf('studentId',e.target.value)}style={{textAlign:'right'}}><option value="">Seleccionar...</option>{students.map(s=><option key={s.id}value={s.id}>{s.nombre}</option>)}</select></div>

            <input value={newSlot}onChange={e=>setNewSlot(e.target.value)}placeholder="09:00-10:30"style={{flex:1,background:'var(--surface)',border:'1.5px solid var(--border)',borderRadius:9,padding:'10px 12px',fontSize:15,outline:'none',color:'var(--ink)'}}onKeyDown={e=>e.key==='Enter'&&addSlot()}/>

/* ══ DOCUMENTOS (Coord) — Checklist DS N°170 Cartilla 5 ═════════════════ */

function ChecklistSheet({student,checklists,setChecklists,revisions,setRevisions,user,onClose}){
  const docs=getDocsForStudent(student);
  const[chk,setChk]=useState({...(checklists[student.id]||{})});
  const[obs,setObs]=useState('');const[showSave,setShowSave]=useState(false);
  const toggle=id=>setChk(p=>({...p,[id]:{...p[id],checked:!p[id]?.checked}}));
  const checked=docs.filter(d=>chk[d.id]?.checked).length;
  const pct=Math.round(checked/docs.length*100);
  const saveRevision=()=>{
    setChecklists(p=>({...p,[student.id]:chk}));
    const rev={id:newId(),studentId:student.id,studentName:student.nombre,revisorName:`${user.nombre} ${user.apellido||''}`.trim(),date:todayStr(),docsChecked:checked,docsTotal:docs.length,obs:obs.trim()};
    setRevisions(p=>[rev,...p]);
    setObs('');setShowSave(false);onClose();
  };
  return(
    <Sheet open title="Carpeta del estudiante"onClose={onClose}rightAction={<button onClick={()=>setShowSave(true)}style={{color:'var(--blue)',fontWeight:600,fontSize:16}}>Guardar</button>}>
      {/* Header */}
      <div style={{padding:'12px 16px 14px',borderBottom:'1px solid var(--border)'}}>
        <div style={{display:'flex',gap:12,alignItems:'center',marginBottom:10}}>
          <Avatar name={student.nombre}size={44}/>
          <div><div style={{fontWeight:700,fontSize:16}}>{student.nombre}</div><div style={{fontSize:13,color:'var(--ink2)',marginTop:2}}>{student.curso} · {student.nee} · {student.diag}</div></div>
        </div>
        {/* Progress bar */}
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:5}}>
          <span style={{fontSize:13,fontWeight:600}}>Documentación</span>
          <span style={{fontSize:13,color:pct===100?'var(--green-dark)':pct>50?'var(--orange)':'var(--red)',fontWeight:700}}>{checked}/{docs.length} ({pct}%)</span>
        </div>
        <div style={{height:8,background:'var(--surface3)',borderRadius:4,overflow:'hidden'}}><div style={{height:'100%',width:`${pct}%`,background:pct===100?'var(--green)':pct>50?'var(--orange)':'var(--red)',borderRadius:4,transition:'.4s'}}/></div>
      </div>
      {/* Docs list */}
      <div className="sec-title-sm"style={{paddingTop:16}}>Documentos obligatorios — DS N°170</div>
      <div style={{margin:'0 16px'}}>
        {docs.map((doc,i,arr)=>(
          <div key={doc.id}className="chk-row"style={{borderRadius:i===0&&arr.length>1?'var(--radius) var(--radius) 0 0':i===arr.length-1&&arr.length>1?'0 0 var(--radius) var(--radius)':arr.length===1?'var(--radius)':''}}>
            <div className={`chk-box ${chk[doc.id]?.checked?'checked':''}`}onClick={()=>toggle(doc.id)}>{chk[doc.id]?.checked&&<i className="ph ph-check"/>}</div>
            <div style={{flex:1}}>
              <div className={`chk-label ${chk[doc.id]?.checked?'done':''}`}>{doc.label}</div>
            </div>
          </div>
        ))}
      </div>
      {/* Save with obs */}
      {showSave&&<div style={{margin:'16px 16px 0',background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'var(--radius)',overflow:'hidden'}}>
        <div style={{padding:'12px 14px 0',fontWeight:700,fontSize:15}}>Registrar revisión</div>
        <div className="field-row"style={{padding:'12px 14px'}}><label style={{alignSelf:'flex-start',paddingTop:2}}>Obs.</label><textarea value={obs}onChange={e=>setObs(e.target.value)}rows={3}placeholder="Observaciones de la revisión..."/></div>
        <div style={{display:'flex',gap:8,padding:'0 14px 14px'}}><button className="btn btn-gray btn-sm"onClick={()=>setShowSave(false)}>Cancelar</button><button className="btn btn-blue btn-sm"onClick={saveRevision}><i className="ph ph-check"/>Guardar revisión</button></div>
      </div>}
      <div style={{height:32}}/>
    </Sheet>
  );
}

        <div style={{margin:'0 16px'}}>
          <div className="inset-row"><i className="ph ph-bell-ringing-fill"style={{fontSize:22,color:'var(--orange)'}}/><div style={{flex:1}}><div style={{fontWeight:500,fontSize:16}}>Alertas de citas</div></div><IosToggle on={alertSettings.enabled}onChange={v=>setAlertSettings(p=>({...p,enabled:v}))}/></div>
          <div className="inset-row"><i className="ph ph-timer-fill"style={{fontSize:22,color:'var(--blue)'}}/><div style={{flex:1,fontWeight:500,fontSize:16}}>Anticipación</div><select value={alertSettings.minutes}onChange={e=>setAlertSettings(p=>({...p,minutes:Number(e.target.value)}))}style={selStyle}>{ALERT_OPTS.map(m=><option key={m}value={m}>{m} min</option>)}</select></div>
          <div className="inset-row"><i className="ph ph-speaker-high-fill"style={{fontSize:22,color:'var(--purple)'}}/><div style={{flex:1,fontWeight:500,fontSize:16}}>Sonido</div><IosToggle on={alertSettings.sound||false}onChange={v=>setAlertSettings(p=>({...p,sound:v}))}/></div>
        </div>
        {/* Apariencia */}
        <div className="sec-title-sm"style={{paddingTop:24}}>Apariencia</div>
        <div style={{margin:'0 16px'}}>
          <div className="inset-row"><i className="ph ph-moon-fill"style={{fontSize:22,color:'var(--purple)'}}/><div style={{flex:1,fontWeight:500,fontSize:16}}>Tema</div><select value={appSettings.theme}onChange={e=>setAppSettings(p=>({...p,theme:e.target.value}))}style={selStyle}>{THEMES.map(t=><option key={t.val}value={t.val}>{t.label}</option>)}</select></div>
          <div className="inset-row"><i className="ph ph-text-aa-fill"style={{fontSize:22,color:'var(--teal)'}}/><div style={{flex:1,fontWeight:500,fontSize:16}}>Tamaño letra</div><select value={appSettings.fontSize}onChange={e=>setAppSettings(p=>({...p,fontSize:e.target.value}))}style={selStyle}>{FONT_SIZES.map(f=><option key={f.val}value={f.val}>{f.label}</option>)}</select></div>
          <div className="inset-row"><i className="ph ph-palette-fill"style={{fontSize:22,color:'var(--pink)'}}/><div style={{flex:1,fontWeight:500,fontSize:16}}>Color acento</div>
            <div style={{display:'flex',gap:7}}>{['#007AFF','#34C759','#FF9500','#FF2D55','#AF52DE','#5AC8FA'].map(c=>(<div key={c}onClick={()=>setAppSettings(p=>({...p,accent:c}))}style={{width:22,height:22,borderRadius:'50%',background:c,cursor:'pointer',border:appSettings.accent===c?'2.5px solid var(--ink)':'2.5px solid transparent',transition:'.15s'}}/>))}</div>
          </div>
        </div>
        {/* Info */}
        <div className="sec-title-sm"style={{paddingTop:24}}>Acerca de la app</div>
        <div style={{margin:'0 16px'}}>
          {[['ph-info-fill','var(--blue)','Versión','2.1 (DS N°170/2025)'],['ph-device-mobile-fill','var(--green)','Plataforma','Web App'],['ph-book-bookmark-fill','var(--orange)','Normativa','Decreto Supremo N°170'],['ph-flag-fill','var(--purple)','Región','Chile']].map(([icon,color,label,val])=>(
            <div key={label}className="inset-row"><i className={`ph ${icon}`}style={{fontSize:22,color}}/><div style={{flex:1,fontWeight:500,fontSize:16}}>{label}</div><span style={{color:'var(--ink2)',fontSize:14}}>{val}</span></div>
          ))}
        </div>
        <div style={{padding:'28px 16px 0'}}><button className="btn btn-red"onClick={onLogout}><i className="ph ph-sign-out"/>Cerrar sesión</button></div>
      </div>
    </div>
    {/* Edit user profile */}
    <Sheet open={showEditUser}title="Editar perfil"onClose={()=>setShowEditUser(false)}rightAction={<button onClick={()=>{setUser(uf);setShowEditUser(false);}}style={{color:'var(--blue)',fontWeight:600,fontSize:16}}>Guardar</button>}>
      <label className="field-label">Datos personales</label>
      <div className="field-inner">
        <div className="field-row"><label>Nombre</label><input value={uf.nombre}onChange={e=>setUf(p=>({...p,nombre:e.target.value}))}/></div>
        <div className="field-row"><label>Apellido</label><input value={uf.apellido||''}onChange={e=>setUf(p=>({...p,apellido:e.target.value}))}/></div>
        <div className="field-row"><label>RUT</label><input value={uf.rut||''}onChange={e=>setUf(p=>({...p,rut:e.target.value}))}placeholder="12.345.678-9"/></div>
        <div className="field-row"><label>Fecha nac.</label><input value={uf.fnac||''}onChange={e=>setUf(p=>({...p,fnac:e.target.value}))}placeholder="dd-mm-aaaa"/></div>
        <div className="field-row"><label>Email</label><input type="email"value={uf.email||''}onChange={e=>setUf(p=>({...p,email:e.target.value}))}/></div>
      </div>
      <label className="field-label">Datos profesionales</label>
      <div className="field-inner">
        <div className="field-row"><label>Profesión</label><input value={uf.profesion||''}onChange={e=>setUf(p=>({...p,profesion:e.target.value}))}/></div>
        <div className="field-row"><label>Especialidad</label><select value={uf.rol}onChange={e=>setUf(p=>({...p,rol:e.target.value}))}style={{textAlign:'right'}}>{ROLES.map(r=><option key={r}>{r}</option>)}</select></div>
        <div className="field-row"><label>Reg. MINEDUC</label><input value={uf.regMineduc||''}onChange={e=>setUf(p=>({...p,regMineduc:e.target.value}))}placeholder="N° registro ministerial"/></div>
        <div className="field-row"><label>Establecimiento</label><input value={uf.colegio||''}onChange={e=>setUf(p=>({...p,colegio:e.target.value}))}/></div>
      </div>
      <label className="field-label">Perfil adicional</label>
      <div className="field-inner"><div className="inset-row"><i className="ph ph-briefcase-fill"style={{fontSize:22,color:'#5AC8FA'}}/><div style={{flex:1}}><div style={{fontWeight:500,fontSize:16}}>Coordinadora/or PIE</div></div><IosToggle on={uf.isCoord}onChange={v=>setUf(p=>({...p,isCoord:v}))}/></div></div>
      <div style={{height:40}}/>
    </Sheet>
  </>);
}

/* ══ ROOT APP ════════════════════════════════════════════════════════════ */
function App(){
  const[screen,setScreen]=useState('login');
  const[user,setUser]=useState(()=>lsGet('pie_user',null));
  const[tab,setTab]=useState('home');
  const[mode,setMode]=useState('prof');

  const[students,setStudents]=useState(()=>lsGet('pie_students',INIT_STUDENTS));
  const[observations,setObservations]=useState(()=>lsGet('pie_obs',INIT_OBS));
  const[aulaLogs,setAulaLogs]=useState(()=>lsGet('pie_aula',INIT_AULA));
  const[cursos,setCursos]=useState(()=>lsGet('pie_cursos',INIT_CURSOS));
  const[profs,setProfs]=useState(()=>lsGet('pie_profs',INIT_PROFS));
  const[agenda,setAgenda]=useState(()=>lsGet('pie_agenda',INIT_AGENDA));
  const[evals,setEvals]=useState(()=>lsGet('pie_evals',INIT_EVALS));
  const[checklists,setChecklists]=useState(()=>lsGet('pie_checklists',INIT_CHECKLISTS));
  const[revisions,setRevisions]=useState(()=>lsGet('pie_revisions',INIT_REVISIONS));
  const[alertSettings,setAlertSettings]=useState(()=>lsGet('pie_alerts',{enabled:true,minutes:15,sound:false}));
  const[appSettings,setAppSettings]=useState(()=>lsGet('pie_appsettings',{autoSave:true,saveInterval:15,theme:'auto',fontSize:'normal',accent:'#007AFF'}));

  const[toast,showToast]=useToast();
  const[alerts,dismissAlert]=useAlertWatcher(agenda,alertSettings);

  // Apply theme & font
  useEffect(()=>{
    const root=document.querySelector('.app-shell');if(!root)return;
    if(appSettings.theme==='dark')root.setAttribute('data-theme','dark');
    else if(appSettings.theme==='light')root.removeAttribute('data-theme');
    else{if(window.matchMedia('(prefers-color-scheme: dark)').matches)root.setAttribute('data-theme','dark');else root.removeAttribute('data-theme');}
  },[appSettings.theme]);
  useEffect(()=>{const root=document.querySelector('.app-shell');if(root)root.setAttribute('data-fontsize',appSettings.fontSize||'normal');},[appSettings.fontSize]);
  useEffect(()=>{
    const root=document.querySelector('.app-shell');if(!root)return;
    root.style.setProperty('--accent',appSettings.accent||'#007AFF');
  },[appSettings.accent]);

  // Autosave
  const allData=useMemo(()=>({students,observations,aulaLogs,cursos,profs,agenda,evals,checklists,revisions,user,alertSettings,appSettings}),[students,observations,aulaLogs,cursos,profs,agenda,evals,checklists,revisions,user,alertSettings,appSettings]);
  const[saveStatus,setSaveStatus]=useState('saved');
  const saveNow=useCallback(()=>{
    lsSet('pie_students',students);lsSet('pie_obs',observations);lsSet('pie_aula',aulaLogs);lsSet('pie_cursos',cursos);lsSet('pie_profs',profs);lsSet('pie_agenda',agenda);lsSet('pie_evals',evals);lsSet('pie_checklists',checklists);lsSet('pie_revisions',revisions);lsSet('pie_user',user);lsSet('pie_alerts',alertSettings);lsSet('pie_appsettings',appSettings);
    setSaveStatus('saved');showToast('Guardado ✓');
  },[students,observations,aulaLogs,cursos,profs,agenda,evals,checklists,revisions,user,alertSettings,appSettings,showToast]);
  useEffect(()=>{if(!appSettings.autoSave)return;setSaveStatus('saving');const id=setTimeout(saveNow,appSettings.saveInterval*1000);return()=>clearTimeout(id);},[allData,appSettings.autoSave,appSettings.saveInterval,saveNow]);

  useEffect(()=>{const saved=lsGet('pie_user',null);if(saved&&saved.nombre)setUser(saved);},[]);

  const handleLogin=()=>{try{const saved=lsGet('pie_user',null);if(saved&&saved.nombre){setUser(saved);setScreen('app');}else{setScreen('register');}}catch(e){setScreen('register');}};
  const handleRegister=u=>{setUser(u);lsSet('pie_user',u);setScreen('app');};
  const handleLogout=()=>{setScreen('login');setTab('home');};
  const switchMode=()=>{setMode(m=>m==='prof'?'coord':'prof');setTab('home');};

  const tabs=mode==='prof'?PROF_TABS:COORD_TABS;

  if(screen==='login')return(<div className="app-shell"style={{justifyContent:'center'}}><StatusBar/><LoginScreen onLogin={handleLogin}onNewUser={()=>setScreen('register')}/></div>);
  if(screen==='register')return(<div className="app-shell"><StatusBar/><NavBar title="Registro"onBack={()=>setScreen('login')}backLabel="Volver"/><RegisterScreen onRegister={handleRegister}/></div>);

  const curUser=user||INIT_USER;
  return(
    <div className="app-shell">
      <StatusBar/>
      <GreetingBar user={curUser}mode={mode}onSwitchMode={switchMode}autoSaveStatus={saveStatus}/>
      <AlertBanners alerts={alerts}onDismiss={dismissAlert}/>
      <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
        {mode==='prof'&&<>
          {tab==='home'&&<ProfHomeScreen user={curUser}students={students}agenda={agenda}cursos={cursos}setTab={setTab}/>}
          {tab==='cursos'&&<CursosScreen students={students}setStudents={setStudents}observations={observations}setObservations={setObservations}aulaLogs={aulaLogs}setAulaLogs={setAulaLogs}cursos={cursos}setCursos={setCursos}/>}
          {tab==='agenda'&&<AgendaScreen agenda={agenda}setAgenda={setAgenda}students={students}alertSettings={alertSettings}/>}
          {tab==='eval'&&<EvaluacionesScreen evals={evals}setEvals={setEvals}students={students}profs={profs}/>}
          {tab==='config'&&<ConfigScreen alertSettings={alertSettings}setAlertSettings={setAlertSettings}appSettings={appSettings}setAppSettings={setAppSettings}user={curUser}setUser={u=>{setUser(u);lsSet('pie_user',u);}}onLogout={handleLogout}saveNow={saveNow}/>}
        </>}
        {mode==='coord'&&<>
          {tab==='home'&&<CoordHomeScreen user={curUser}students={students}profs={profs}agenda={agenda}setTab={setTab}checklists={checklists}/>}
          {tab==='equipo'&&<EquipoScreen profs={profs}setProfs={setProfs}agenda={agenda}/>}
          {tab==='agenda'&&<AgendaScreen agenda={agenda}setAgenda={setAgenda}students={students}alertSettings={alertSettings}/>}
          {tab==='docs'&&<DocsScreen students={students}checklists={checklists}setChecklists={setChecklists}revisions={revisions}setRevisions={setRevisions}user={curUser}/>}
          {tab==='resumen'&&<ResumenScreen students={students}profs={profs}agenda={agenda}evals={evals}checklists={checklists}/>}
          {tab==='config'&&<ConfigScreen alertSettings={alertSettings}setAlertSettings={setAlertSettings}appSettings={appSettings}setAppSettings={setAppSettings}user={curUser}setUser={u=>{setUser(u);lsSet('pie_user',u);}}onLogout={handleLogout}saveNow={saveNow}/>}
        </>}
      </div>
      <TabBar tabs={tabs}active={tab}onChange={setTab}alertCount={alerts.length}/>
      <div className={`toast ${toast.show?'show':''}`}><i className={`ph ${toast.kind==='err'?'ph-warning':'ph-check-circle'}`}/>{toast.msg}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>


</body></html>
