<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduMax PIE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1C4532;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif}
.card{background:#fff;border-radius:20px;padding:40px 32px;width:320px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
h1{font-size:32px;font-weight:800;color:#1C4532;margin-bottom:4px}
p{color:#666;font-size:14px;margin-bottom:28px}
input{width:100%;padding:14px;font-size:17px;border:2px solid #ddd;border-radius:10px;outline:none;margin-bottom:8px;font-family:inherit}
input:focus{border-color:#34C759}
button{width:100%;padding:14px;font-size:17px;font-weight:700;background:#34C759;color:#fff;border:none;border-radius:10px;cursor:pointer}
.msg{margin-top:12px;font-size:14px;min-height:20px}
.err{color:#FF3B30}
</style>
</head>
<body>
<div class="card">
  <h1>EduMax PIE</h1>
  <p>Programa de Integración Escolar</p>
  <input type="password" id="pw" placeholder="Contraseña" autofocus>
  <button onclick="entrar()">Ingresar</button>
  <div class="msg" id="msg"></div>
</div>

<script>
document.getElementById('pw').onkeydown = function(e){ if(e.key==='Enter') entrar(); }

function entrar(){
  var clave = document.getElementById('pw').value.trim();
  var msg = document.getElementById('msg');
  if(clave === 'pie2026'){
    msg.innerHTML = '';
    cargarApp();
  } else {
    msg.innerHTML = '<span class="err">Contraseña incorrecta</span>';
  }
}

function cargarApp(){
  document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:system-ui"><div style="text-align:center;color:#fff"><div style="font-size:60px">✅</div><h2 style="font-size:28px;margin-top:16px">¡Funcionó!</h2><p style="margin-top:8px;opacity:.8">Ahora se cargará la app completa...</p></div></div>';
  setTimeout(function(){
    window.location.href = 'app.html';
  }, 1500);
}
</script>
</body>
</html>
